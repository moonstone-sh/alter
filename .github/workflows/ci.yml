name: Alter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and export Alter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: main
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          ref: v0.3.6
          path: .ci/ballad
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/valua
          ref: v0.2.2
          path: .ci/valua
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize locked workspace
        run: moon sync --locked
      - name: Synchronize local package dependencies
        run: scripts/sync-local-packages.sh
      - name: Run host and backend tests
        run: |
          moon exec env \
            LUA_PATH="$GITHUB_WORKSPACE/.ci/valua/src/?.lua;$GITHUB_WORKSPACE/.ci/valua/src/?/init.lua;;" \
            lua test_all.lua
      - name: Export the complete orbit
        run: moon run package
      - name: Export release packages
        env:
          BALLAD_ROOT: ${{ github.workspace }}/.ci/ballad
        run: scripts/package-all.sh
      - name: Verify all release package descriptors
        run: scripts/verify-release-descriptors.sh
