name: Alter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and export Alter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: 69d2859c80a8b3221e9368d6414ba11fdef486de
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          ref: af29ad4224bcd7ec48c371154fbc3b46fb29a9e5
          path: .ci/ballad
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/valua
          ref: v0.2.2
          path: .ci/valua
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y b3sum zstd
      - name: Build Moonstone CLI
        working-directory: .ci/moonstone
        run: |
          zig build
          echo "$GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin" >> "$GITHUB_PATH"
      - name: Synchronize workspace for this runner target
        run: |
          for project in . host json-backend toml-backend jsonc-backend; do
            moon -C "$project" remove moonstone/ballad --no-sync
            moon -C "$project" add "path:$GITHUB_WORKSPACE/.ci/ballad" --tool --no-sync
          done
          moon sync --update
      - name: Synchronize local package dependencies
        run: scripts/sync-local-packages.sh
      - name: Run host and backend tests
        run: |
          moon exec -- lua -e "package.path = [[$GITHUB_WORKSPACE/.ci/valua/src/?.lua;$GITHUB_WORKSPACE/.ci/valua/src/?/init.lua;]] .. package.path; dofile('test_all.lua')"
      - name: Export the complete orbit
        run: moon run package
      - name: Export release packages
        env:
          BALLAD_ROOT: ${{ github.workspace }}/.ci/ballad
        run: scripts/package-all.sh
      - name: Verify all release package descriptors
        run: scripts/verify-release-descriptors.sh

  windows:
    name: Native Windows edits and orbit exports
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/moonstone
          ref: 69d2859c80a8b3221e9368d6414ba11fdef486de
          path: .ci/moonstone
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/ballad
          ref: af29ad4224bcd7ec48c371154fbc3b46fb29a9e5
          path: .ci/ballad
      - uses: actions/checkout@v4
        with:
          repository: moonstone-sh/valua
          ref: v0.2.2
          path: .ci/valua
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build Moonstone
        working-directory: .ci/moonstone
        run: zig build
      - name: Exercise edits and all source exports
        shell: pwsh
        run: |
          $env:MOONSTONE_BIN = "$env:GITHUB_WORKSPACE/.ci/moonstone/zig-out/bin/moon.exe"
          python tests/platform/native_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw 'Alter lifecycle failed' }
